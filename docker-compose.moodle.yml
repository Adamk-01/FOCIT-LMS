# ==============================================================================
# FOCIT LMS — Local Real Moodle in Docker (Development Mode)
# ==============================================================================
# Usage:
#   Start: docker compose -f docker-compose.moodle.yml up -d
#   Logs:  docker compose -f docker-compose.moodle.yml logs -f moodle
#   Stop:  docker compose -f docker-compose.moodle.yml down
#
# Access:
#   Browser URL: http://localhost:8080
#   Username:    admin
#   Password:    AdminPassword123!
# ==============================================================================

services:
  moodle-db:
    image: mariadb:11.4
    container_name: focit-moodle-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword123
      - MYSQL_USER=bn_moodle
      - MYSQL_PASSWORD=bitnami_password123
      - MYSQL_DATABASE=bitnami_moodle
      - MARIADB_ROOT_PASSWORD=rootpassword123
      - MARIADB_USER=bn_moodle
      - MARIADB_PASSWORD=bitnami_password123
      - MARIADB_DATABASE=bitnami_moodle
    volumes:
      - moodle_db_data:/var/lib/mysql
    networks:
      - moodle-local-net

  moodle:
    image: cloudtooling/moodle:latest
    container_name: focit-moodle-app
    restart: unless-stopped
    depends_on:
      - moodle-db
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - MOODLE_DATABASE_HOST=moodle-db
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_PASSWORD=bitnami_password123
      - MOODLE_SITE_NAME=FOCIT Learning Engine (Local Dev)
      - MOODLE_HOST=localhost:8080
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=AdminPassword123!
      - MOODLE_EMAIL=admin@focit.uniosun.edu.ng
      - ALLOW_EMPTY_PASSWORD=no
    volumes:
      - moodle_app_data:/bitnami/moodle
      - moodle_storage_data:/bitnami/moodledata
    networks:
      - moodle-local-net

networks:
  moodle-local-net:
    driver: bridge

volumes:
  moodle_db_data:
    name: focit_moodle_db_data
  moodle_app_data:
    name: focit_moodle_app_data
  moodle_storage_data:
    name: focit_moodle_storage_data
