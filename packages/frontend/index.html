<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/faculty-favicon.png" />
    <link rel="apple-touch-icon" href="/faculty-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOCIT LMS — Faculty of Computing & Information Technology (UNIOSUN)</title>
    <!-- Google Fonts: Inter, Merriweather, Outfit (matching focit-rouge.vercel.app) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Anti-FOUC Zero-Latency Theme Hydration Script -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('focit_theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (theme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[#f8fafc] text-[#0f172a] dark:bg-[#090d16] dark:text-[#f8fafc] antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
